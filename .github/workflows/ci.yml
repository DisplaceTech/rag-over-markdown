name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against fresh runners and PHP patch releases, so a green
  # badge means "green this week". GitHub disables scheduled workflows in
  # public repos after 60 days with no repository activity; the weekly
  # Dependabot PRs (and merging them) are what keep this schedule alive.
  schedule:
    - cron: '35 6 * * 1'   # Mondays 06:35 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Static checks + the contract-level unit tests. The Retriever/Corpus
  # tests run against in-memory ai-contracts fakes — no extensions, no
  # models. The end-to-end test self-skips here: it needs the ext-infer
  # and ext-turbovec binaries plus ~1.3GB of GGUF models, which stay out
  # of CI by design (same policy as the extensions themselves). PHPStan
  # analyzes against the committed extension stubs.
  lint:
    name: cs + static analysis + tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer validate --strict

      - run: composer install --no-interaction --no-progress --ignore-platform-req=ext-infer --ignore-platform-req=ext-turbovec

      - run: composer cs
        if: matrix.php == '8.4'

      - run: composer stan

      - run: composer test
